name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field, so CI and local
      # development cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs the token build, then `tsc -b`, then vite. Type
      # errors fail here rather than reaching the browser.
      - name: Build
        run: pnpm build
